[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ceche"
version = "2.0.0"
description = "Domain Appraisal Engine — evaluate any domain across 16 dimensions"
readme = "README.md"
authors = [
    { name = "Ceche Contributors" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
cli = ["typer>=0.12.0", "rich>=13.0.0"]
web = ["fastapi>=0.110.0", "uvicorn>=0.27.0", "pydantic>=2.5.0"]
m6 = ["wordfreq>=3.0.0"]
m7 = ["pytrends>=4.9.0"]
all = [
    "ceche[cli,web,m6,m7]",
    "pyphen>=0.14.0",
    "nltk>=3.8.0",
]
dev = [
    "ceche[all]",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ceche"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "G", "PTH", "RUF"]
ignore = [
    "BLE001",
    "ANN101",
    "ANN102",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN401",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "DTZ011",
    "PLR2004",
    "S101",
    "TC001",
    "TC003",
    "ARG002",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "S101", "ARG002"]

[tool.mypy]
strict = true
python_version = "3.10"
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
