name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy ceche/ --ignore-missing-imports

      - name: Test
        run: pytest tests/ -q --tb=short

  cli-tests:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e ".[all,dev]"

      - name: Test CLI commands
        run: |
          echo "=== ceche --version ==="
          ceche --version
          echo "=== ceche check --help ==="
          ceche check --help
          echo "=== ceche bulk --help ==="
          ceche bulk --help
          echo "=== ceche keys ==="
          ceche keys
          echo "=== ceche stats ==="
          ceche stats
          echo "=== ceche history ==="
          ceche history
          echo "=== ceche cache ==="
          ceche cache
          echo "=== ceche config ==="
          ceche config --format json
          echo "=== ceche version check ==="
          ceche version check
          echo "=== ceche appraise alias ==="
          ceche appraise --help
          echo "=== python -m ceche ==="
          python -m ceche --version
